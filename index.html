<script>
// --- Navigation Logic ---
document.querySelectorAll('nav.tabs button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('nav.tabs button').forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    document.getElementById(b.dataset.view).classList.add('active');
  };
});

// --- Data & State ---
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const START_HOUR = 7, END_HOUR = 22;
const catColor = {academic: '#ff5c7a', extracurricular: '#ffb13d', personal: '#36d1a6'};
const catLabel = {academic: 'Academic', extracurricular: 'Extracurricular', personal: 'Personal'};

let weekOffset = 0;
let editIdx = null;

let tasks = JSON.parse(localStorage.getItem('balancia_tasks_v2') || 'null') || [
  {title: 'Midterm exam - Statistics', cat: 'academic', u: 1, i: 1},
  {title: 'Read 2 chapters for Literature', cat: 'academic', u: 0, i: 1},
  {title: 'Reply to club group chat', cat: 'extracurricular', u: 1, i: 0},
  {title: 'Scroll social media', cat: 'personal', u: 0, i: 0}
];

let events = JSON.parse(localStorage.getItem('balancia_events_v2') || 'null') || [
  {title: 'Calculus Lecture', cat: 'academic', day: 0, start: 9, end: 10, u: 1, i: 1},
  {title: 'Debate Club', cat: 'extracurricular', day: 2, start: 16, end: 18, u: 0, i: 1},
  {title: 'Gym', cat: 'personal', day: 4, start: 7, end: 8, u: 0, i: 0}
];

function saveTasks() { localStorage.setItem('balancia_tasks_v2', JSON.stringify(tasks)); }
function saveEvents() { localStorage.setItem('balancia_events_v2', JSON.stringify(events)); }
function fmtHour(h) { let ap = h < 12 ? 'AM' : 'PM'; let hr = h % 12; if(hr === 0) hr = 12; return hr + ' ' + ap; }

// --- Initialization ---
function init() {
  // Populate dropdowns for the modal
  let daySel = document.getElementById('e-day');
  DAYS.forEach((d, i) => daySel.innerHTML += `<option value="${i}">${d}</option>`);
  
  let startSel = document.getElementById('e-start'), endSel = document.getElementById('e-end');
  for(let i = START_HOUR; i <= END_HOUR; i++) {
    startSel.innerHTML += `<option value="${i}">${fmtHour(i)}</option>`;
    endSel.innerHTML += `<option value="${i}">${fmtHour(i)}</option>`;
  }
  
  renderMatrix();
  renderCalendar();
}

// --- The Eisenhower Matrix Render ---
function renderMatrix() {
  // Clear existing items
  ['q1', 'q2', 'q3', 'q4'].forEach(id => document.getElementById(id).innerHTML = '');
  
  let countQ1 = 0, countQ2 = 0;

  // 1. Loop through standard Tasks
  tasks.forEach((t, i) => {
    let targetQuad = (t.u == 1 && t.i == 1) ? 'q1' : (t.u == 0 && t.i == 1) ? 'q2' : (t.u == 1 && t.i == 0) ? 'q3' : 'q4';
    if(targetQuad === 'q1') countQ1++;
    if(targetQuad === 'q2') countQ2++;

    document.getElementById(targetQuad).innerHTML += `
      <div class="task">
        <div>
          <div>${t.title}</div>
          <div class="meta"><span class="tag">${catLabel[t.cat]}</span></div>
        </div>
        <button class="del" onclick="deleteTask(${i})">&times;</button>
      </div>`;
  });

  // 2. Loop through Events (This is what makes them show up in the matrix!)
  events.forEach((e, i) => {
    let targetQuad = (e.u == 1 && e.i == 1) ? 'q1' : (e.u == 0 && e.i == 1) ? 'q2' : (e.u == 1 && e.i == 0) ? 'q3' : 'q4';
    if(targetQuad === 'q1') countQ1++;
    if(targetQuad === 'q2') countQ2++;

    document.getElementById(targetQuad).innerHTML += `
      <div class="task">
        <div>
          <div><span class="calicon">📅</span> ${e.title}</div>
          <div class="meta">
            <span class="tag">${catLabel[e.cat]}</span>
            <span class="timetag">${DAYS[e.day]} ${fmtHour(e.start)} - ${fmtHour(e.end)}</span>
          </div>
        </div>
        <button class="del" onclick="deleteEvent(${i})">&times;</button>
      </div>`;
  });

  // Handle empty states
  ['q1', 'q2', 'q3', 'q4'].forEach(id => {
    if(document.getElementById(id).innerHTML === '') {
      document.getElementById(id).innerHTML = `<div style="font-size:13px;color:var(--muted);padding:10px 0;">No tasks</div>`;
    }
  });

  // Update Dashboard numbers
  document.getElementById('c-total').innerText = tasks.length + events.length;
  document.getElementById('c-do').innerText = countQ1;
  document.getElementById('c-sched').innerText = countQ2;
  document.getElementById('c-events').innerText = events.length;
}

  });
